<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive FHD Canvas 9:16</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="canvas-9-16" id="appCanvas">
<div class="main-buttons">
<button class="btn-start" id="startBtn">Mulai</button>
<button class="btn-settings" id="openSettingsBtn">Pengaturan</button>
<button class="btn-settings" id="exitBtn">Keluar</button>
</div>
<div class="modal-overlay" id="settingsModal"><div class="settings-menu">
<h2 id="settingsTitle">Pengaturan</h2><div class="settings-content">
<div class="setting-row"><div class="setting-label" id="gameSoundLabel">• Suara Game</div><div class="setting-control"><input type="range" id="gameSoundSlider" min="0" max="100" value="100"></div></div>
<div class="setting-row"><div class="setting-label" id="bgmLabel">• BGM</div><div class="setting-control"><input type="range" id="bgmSlider" min="0" max="100" value="100"></div></div>
<div class="setting-row"><div class="setting-label" id="languageLabel">• Language</div><div class="setting-control"><select id="languageSelect"><option value="id">Indonesia</option><option value="en">English</option></select></div></div>
</div><button class="btn-invisible-close" id="closeSettingsBtn">[Tutup]</button>
</div></div>
<div class="modal-overlay" id="exitModal"><div class="settings-menu exit-confirm-menu">
<div class="exit-confirm-content" id="exitMessage">Yakin mau keluar?</div>
<div class="exit-confirm-buttons"><button id="cancelExitBtn">BATAL</button><button id="confirmExitBtn">OKE</button></div>
</div></div>
<div class="game-screen" id="gameScreen"><canvas id="gameCanvas"></canvas>
<div class="game-hud"><div class="hud-box">Score: <span id="scoreText">0</span></div><div class="hud-box"><span id="ballName">Mini</span></div></div>
<div class="game-result" id="gameResult"><div class="result-box"><div class="result-title" id="resultTitle">GAME OVER</div><div class="result-score" id="resultScore">Score: 0</div><button id="restartBtn">Main Lagi</button><button id="menuBtn">Menu Utama</button></div></div>
</div></div>
<script src="js/game.js"></script></body></html>
